[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-cabin"
version = "0.4.0"
description = "A cosy log cabin with a ticking grandfather clock and live weather"
authors = [{ name = "Mike Hellyer" }]
requires-python = ">=3.12"
dependencies = [
    "PySide6",
    "platformdirs",
    "certifi",
    "numpy",
    "jeepney; sys_platform == 'linux'",  # D-Bus, to keep the screen awake
    "qrcode",  # the phone remote's QR code
]

[project.scripts]
simple-cabin = "simple_cabin.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"simple_cabin.gui" = ["resources/*.png"]
"simple_cabin" = ["sounds/*.wav"]
"simple_cabin.core" = ["remote.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
